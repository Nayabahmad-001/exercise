<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ground Exercise Trainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .container {
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      width: 350px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      transition: 0.3s;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
      color: #444;
    }

    .exercise-name {
      font-size: 22px;
      margin: 20px 0;
      color: #1a73e8;
      font-weight: bold;
    }

    .timer {
      font-size: 32px;
      color: #ff4081;
      margin: 15px 0;
    }

    .counter {
      font-size: 20px;
      margin: 10px 0;
      color: #555;
    }

    button {
      background: #1a73e8;
      border: none;
      color: #fff;
      padding: 10px 20px;
      margin: 10px 5px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: #0056d6;
    }

    .back-btn {
      background: #f44336;
    }

    .next-btn {
      background: #4caf50;
    }

    .start-btn {
      background: #ff9800;
    }

    .stop-btn {
      background: #9c27b0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ground Exercise Trainer</h1>
    <div class="exercise-name" id="exerciseName">Push-Ups</div>
    <div class="timer" id="timer">00:00</div>
    <div class="counter">Count: <span id="count">0</span></div>

    <div>
      <button class="start-btn" onclick="startTimer()">Start</button>
      <button class="stop-btn" onclick="stopTimer()">Stop</button>
      <button onclick="increaseCount()">+ Count</button>
    </div>
    <div>
      <button class="back-btn" onclick="prevExercise()">Back</button>
      <button class="next-btn" onclick="nextExercise()">Next</button>
    </div>
  </div>

  <script>
    const exercises = [
      "Push-Ups", "Squats", "Lunges", "Jumping Jacks", "Plank", "Sit-Ups",
      "Burpees", "Mountain Climbers", "High Knees", "Side Plank",
      "Leg Raises", "Flutter Kicks", "Wall Sit", "Bicycle Crunches",
      "Tricep Dips", "Arm Circles", "Butt Kicks", "Superman Hold",
      "Calf Raises", "Jump Squats", "Side Lunges", "Skipping", "Cobra Stretch"
    ];

    let currentExercise = 0;
    let seconds = 0;
    let minutes = 0;
    let timerInterval = null;
    let count = 0;

    const exerciseName = document.getElementById("exerciseName");
    const timer = document.getElementById("timer");
    const countDisplay = document.getElementById("count");

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds++;
        if (seconds === 60) {
          minutes++;
          seconds = 0;
        }
        const m = minutes < 10 ? "0" + minutes : minutes;
        const s = seconds < 10 ? "0" + seconds : seconds;
        timer.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function increaseCount() {
      count++;
      countDisplay.textContent = count;
    }

    function nextExercise() {
      if (currentExercise < exercises.length - 1) {
        currentExercise++;
        changeExercise();
      } else {
        alert("🎉 You’ve completed all exercises!");
      }
    }

    function prevExercise() {
      if (currentExercise > 0) {
        currentExercise--;
        changeExercise();
      } else {
        alert("You are at the first exercise!");
      }
    }

    function changeExercise() {
      exerciseName.textContent = exercises[currentExercise];
      resetAll();
    }

    function resetAll() {
      stopTimer();
      seconds = 0;
      minutes = 0;
      count = 0;
      timer.textContent = "00:00";
      countDisplay.textContent = "0";
    }
  </script>
</body>
</html>
